<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Бүртгүүлэх</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://kit.fontawesome.com/1a32fd64af.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image-icon" href="favicon.ico">
  </head>
  <body>
    <a href="index.html">
      <h1 class="logo">
          <span class="primary-text">
              <i class="fas fa-shoe-prints" style="font-size: 24px;"></i>G
          </span>sneaker
      </h1>
    </a>
    <div id="container">
      <div class="form-wrap">
        <h2>Бүртгүүлэх</h2>
        <form>
          <div class="form-group">
            <label for="first-name">Таны нэр</label>
            <input type="text" name="firstName" id="first-name" />
          </div>
          <div class="form-group">
            <label for="last-name">Таны овог</label>
            <input type="text" name="lastName" id="last-name" />
          </div>
          <div class="form-group">
            <label for="email">Таны и-мэйл</label>
            <input type="email" name="email" id="email" />
          </div>
          <div class="form-group">
            <label for="password">Нууц үгээ бичнэ үү</label>
            <input type="password" name="password" id="password" />
          </div>
          <div class="form-group">
            <label for="password2">Нууц үгээ давтан бичнэ үү</label>
            <input type="password" name="pasword2" id="password2" />
          </div>
          <button type="submit" class="btn">Бүртгүүлэх</button>
        </form>
      </div>
      <footer>
        <p>Өмнө бүртгүүлсэн бол <a href="login.html">Нэвтрэх</a></p>
      </footer>
    </div>
  </body>
</html>
